version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: farmer_platform_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: farmer_admin
      MONGO_INITDB_ROOT_PASSWORD: secure_password_change_this
      MONGO_INITDB_DATABASE: farmer_learning_platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - farmer_platform_network

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: farmer_platform_n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change_this_password
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENCRYPTION_KEY=your_encryption_key_here
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    networks:
      - farmer_platform_network
    depends_on:
      - mongodb

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmer_platform_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://farmer_admin:secure_password_change_this@mongodb:27017/farmer_learning_platform?authSource=admin
      - N8N_HOST=n8n
      - N8N_PORT=5678
    env_file:
      - ./config/.env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - farmer_platform_network
    depends_on:
      - mongodb
      - n8n

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: farmer_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - farmer_platform_network

networks:
  farmer_platform_network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  n8n_data:
  redis_data:
